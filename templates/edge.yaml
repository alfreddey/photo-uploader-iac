AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Photo-gallery | Nested child - Edge. CloudFront distribution with OAC in
  front of the private image bucket, plus the bucket policy scoped to this
  distribution.

Parameters:
  ProjectName:
    Type: String
    Default: photo-uploader
    Description: Project name used for resource names and tags.
  Environment:
    Type: String
    Default: dev
    Description: Environment name used for resource names and tags.
  ImageBucketName:
    Type: String
    Description: Name of the image bucket (from the data stack) the policy is applied to.
  ImageBucketArn:
    Type: String
    Description: ARN of the image bucket (from the data stack) scoped in the policy.
  ImageBucketRegionalDomainName:
    Type: String
    Description: Regional domain name of the image bucket (from the data stack) used as the CloudFront origin.

Resources:
  ImageOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-${Environment}-image-oac"
        Description: OAC for the private photo-gallery image bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${ProjectName}-${Environment} image CDN (HTTP allowed, default cert)"
        Enabled: true
        PriceClass: PriceClass_200
        HttpVersion: http2
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Origins:
          - Id: S3ImageOrigin
            # Regional domain name avoids the global-endpoint redirect window
            # right after bucket creation.
            DomainName: !Ref ImageBucketRegionalDomainName
            OriginAccessControlId: !GetAtt ImageOriginAccessControl.Id
            # With OAC the legacy OAI field must be present but empty.
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3ImageOrigin
          ViewerProtocolPolicy: allow-all
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          # AWS managed cache policy "CachingOptimized".
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # Lives here (not in the data stack) because it must be scoped to this
  # distribution's ARN.
  ImageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImageBucketName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${ImageBucketArn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

# Outputs are read by the root template via Fn::GetAtt <NestedStack>.Outputs.*.
Outputs:
  CloudFrontDomainName:
    Description: Domain name of the CloudFront distribution
    Value: !GetAtt Distribution.DomainName

  CloudFrontDistributionId:
    Description: ID of the CloudFront distribution
    Value: !Ref Distribution
