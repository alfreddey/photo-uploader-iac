AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Photo-gallery | Nested child - Data. Private S3 image and artifact buckets,
  Multi-AZ RDS PostgreSQL, and a Secrets Manager DB secret.

Parameters:
  ProjectName:
    Type: String
    Default: photo-uploader
    Description: Project name used for resource names and tags.
  Environment:
    Type: String
    Default: dev
    Description: Environment name used for resource names and tags.
  PrivateSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs (from the network stack) for the DB subnet group.
  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group (from the network stack) for the RDS instance.
  DbName:
    Type: String
    Default: photogallery
    Description: Initial PostgreSQL database name.
  DbInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS instance class.
  DbAllocatedStorage:
    Type: Number
    Default: 20
    Description: Allocated storage (GiB) for RDS.

Resources:
  ImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-${Environment}-images-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # Versioning is REQUIRED by the pipeline stack's S3 source action.
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-${Environment}-artifacts-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-db-credentials"
      Description: !Sub "Generated PostgreSQL credentials for ${ProjectName}-${Environment}"
      GenerateSecretString:
        SecretStringTemplate: '{"username": "dbadmin"}'
        GenerateStringKey: password
        PasswordLength: 32
        # Characters RDS does not accept in master passwords.
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub "${ProjectName}-${Environment}-db-subnets"
      DBSubnetGroupDescription: Private subnets (eu-north-1a/b) for the photo-gallery database
      SubnetIds: !Ref PrivateSubnets
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-${Environment}-db"
      Engine: postgres
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      DBName: !Ref DbName
      MultiAZ: true
      StorageEncrypted: true
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref RdsSecurityGroupId
      MasterUsername: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:password}}"
      BackupRetentionPeriod: 7
      CopyTagsToSnapshot: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # Enriches the secret with host/port/dbname once the instance exists.
  DbSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DbSecret
      TargetId: !Ref Database
      TargetType: AWS::RDS::DBInstance

# Outputs are read by the root template via Fn::GetAtt <NestedStack>.Outputs.*.
Outputs:
  ImageBucketName:
    Description: Name of the private image bucket
    Value: !Ref ImageBucket

  ImageBucketArn:
    Description: ARN of the private image bucket
    Value: !GetAtt ImageBucket.Arn

  ImageBucketRegionalDomainName:
    Description: Regional domain name of the image bucket (CloudFront origin)
    Value: !GetAtt ImageBucket.RegionalDomainName

  RdsEndpoint:
    Description: RDS PostgreSQL endpoint address
    Value: !GetAtt Database.Endpoint.Address

  DbSecretArn:
    Description: ARN of the Secrets Manager secret holding DB credentials
    Value: !Ref DbSecret

  ArtifactBucketName:
    Description: Name of the CodePipeline artifact bucket
    Value: !Ref ArtifactBucket
