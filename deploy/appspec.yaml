# <TASK_DEFINITION> is substituted by CodePipeline; container name/port must
# match the service's load balancer mapping in 4-compute.yaml.
version: 0.0
Resources:
  - TargetService:
      Type: AWS::ECS::Service
      Properties:
        TaskDefinition: <TASK_DEFINITION>
        LoadBalancerInfo:
          ContainerName: "app"
          ContainerPort: 80
